<div id="conference-calculator" style="max-width: 700px; margin: 0 auto; font-family: sans-serif;">
  <h2 style="text-align: center; color: #801c80;">Conference Sponsorship Cost Estimator</h2>

  <!-- All dropdowns as before -->
  <div style="margin-bottom: 20px;">
    <label for="sponsorship">Sponsorship Fee</label>
    <select id="sponsorship">
      <option value="1000">Small: $1,000 - $2,500</option>
      <option value="5000">Medium: $2,500 - $5,000</option>
      <option value="15000">Large: $5,000 - $15,000</option>
      <option value="30000">Premium: $15,000 - $30,000</option>
    </select>
  </div>

  <div style="margin-bottom: 20px;">
    <label for="booth">Booth Setup and Design Costs</label>
    <select id="booth">
      <option value="500">Basic: $500 - $1,000</option>
      <option value="2500">Medium: $1,000 - $2,500</option>
      <option value="5000">Large: $2,500 - $5,000</option>
      <option value="10000">Premium: $5,000 - $10,000</option>
    </select>
  </div>

  <div style="margin-bottom: 20px;">
    <label for="shipping">Shipping Booth Materials</label>
    <select id="shipping">
      <option value="100">Local: $100 - $300</option>
      <option value="500">National: $300 - $500</option>
      <option value="1000">International: $500 - $1,000</option>
    </select>
  </div>

  <div style="margin-bottom: 20px;">
    <label for="travel">Travel (Flights and Transport per Person)</label>
    <select id="travel">
      <option value="200">Local: $100 - $200</option>
      <option value="500">National: $200 - $500</option>
      <option value="1500">International: $500 - $1,500</option>
    </select>
  </div>

  <div style="margin-bottom: 20px;">
    <label for="team">Number of Team Members Attending</label>
    <select id="team">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5+</option>
    </select>
  </div>

  <div style="margin-bottom: 20px;">
    <label for="hotel">Hotel Accommodations per Night</label>
    <select id="hotel">
      <option value="100">Budget: $100 - $150</option>
      <option value="200">Standard: $150 - $200</option>
      <option value="400">Luxury: $200 - $400</option>
    </select>
  </div>

  <div style="margin-bottom: 20px;">
    <label for="nights">Number of Nights</label>
    <select id="nights">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5+</option>
    </select>
  </div>

  <div style="margin-bottom: 20px;">
    <label for="meals">Meal Cost per Day per Person</label>
    <select id="meals">
      <option value="30">Basic: $30 - $50</option>
      <option value="80">Mid-range: $50 - $80</option>
      <option value="150">Premium: $80 - $150</option>
    </select>
  </div>

  <div style="margin-bottom: 20px;">
    <label for="presentation">Presentation Prep Costs</label>
    <select id="presentation">
      <option value="500">Basic: $500 - $1,000</option>
      <option value="2500">Moderate: $1,000 - $2,500</option>
      <option value="5000">High-end: $2,500 - $5,000</option>
    </select>
  </div>

  <div style="margin-bottom: 20px;">
    <label for="networking">Networking and Mixer Event Costs</label>
    <select id="networking">
      <option value="100">Basic: $100 - $300</option>
      <option value="500">Standard: $300 - $500</option>
      <option value="1000">VIP: $500 - $1,000</option>
    </select>
  </div>

  <button id="calculateBtn" style="width:100%; background:#801c80; color:#fff; padding:12px; border:none; font-size:16px; border-radius:5px; cursor:pointer;">Calculate Estimated Cost</button>

  <div class="result" id="result" style="margin-top:20px; font-weight: bold;"></div>

  <div class="additional" id="additional" style="display:none; margin-top:20px;">
    <label for="maximizeROI">Do you want to maximize your return on this investment?</label>
    <select id="maximizeROI">
      <option value="">Select an option</option>
      <option value="yes">Yes</option>
      <option value="no">No</option>
    </select>
  </div>

  <div id="finalMessage" style="margin-top: 20px;"></div>

  <canvas id="confetti" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:9999;"></canvas>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const $ = (id) => document.getElementById(id);

    $("calculateBtn").addEventListener("click", function () {
      const sponsorship = parseInt($("sponsorship").value);
      const booth = parseInt($("booth").value);
      const shipping = parseInt($("shipping").value);
      const travel = parseInt($("travel").value);
      const team = parseInt($("team").value);
      const hotel = parseInt($("hotel").value);
      const nights = parseInt($("nights").value);
      const meals = parseInt($("meals").value);
      const presentation = parseInt($("presentation").value);
      const networking = parseInt($("networking").value);

      const travelTotal = travel * team;
      const hotelTotal = hotel * nights * team;
      const mealTotal = meals * nights * team;

      const total = sponsorship + booth + shipping + travelTotal + hotelTotal + mealTotal + presentation + networking;

      $("result").textContent = `Estimated Total Cost: $${total.toLocaleString()}`;
      $("additional").style.display = "block";
    });

    $("maximizeROI").addEventListener("change", function () {
      const final = $("finalMessage");
      if (this.value === "yes") {
        final.innerHTML = "🎯 Great! Let’s set up a strategy session to maximize your ROI.";
        launchConfetti();
        setTimeout(() => {
          window.location.href = "/10xcc";
        }, 2500);
      } else if (this.value === "no") {
        final.innerHTML = "👍 No worries. You’ve got this!";
      } else {
        final.innerHTML = "";
      }
    });

    // Simple Confetti Generator
    function launchConfetti() {
      const canvas = $("confetti");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const pieces = [];

      for (let i = 0; i < 100; i++) {
        pieces.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          size: Math.random() * 10 + 5,
          speed: Math.random() * 3 + 2,
          color: `hsl(${Math.random() * 360}, 100%, 50%)`,
          rotation: Math.random() * 360
        });
      }

      canvas.style.display = "block";

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotation * Math.PI / 180);
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
        });
      }

      function update() {
        pieces.forEach(p => {
          p.y += p.speed;
          p.rotation += 5;
        });
      }

      function loop() {
        draw();
        update();
        requestAnimationFrame(loop);
      }

      loop();

      setTimeout(() => {
        canvas.style.display = "none";
      }, 2000);
    }
  });
</script>
